[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-data-engine"
version = "0.1.0"
description = "High-scale risk data engine for portfolio analytics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars",
    "duckdb",
    "pyarrow",
    "pydantic",
    "numpy",
    "pandas",
    "pytest",
    "pytest-cov",
    "pyyaml",
    "pydantic-ai",
    "anthropic>=0.61,<0.76",  # pydantic-ai 0.8.x breaks on newer anthropic releases
    "scikit-learn>=1.4,<1.7",
    "python-dotenv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = [".venv/*", "tests/*", "scripts/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
